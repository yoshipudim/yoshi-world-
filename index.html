<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16883b">
  <title>Yoshi World 🍃</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; color: #fff;
      background: radial-gradient(circle at top, #56d66b 0%, transparent 42%),
                  linear-gradient(160deg, #064e29, #087b3a 55%, #032e20);
    }
    main {
      width: 100%; max-width: 480px; padding: 32px 22px; text-align: center;
      border: 1px solid #ffffff33; border-radius: 28px;
      background: #0023117a; box-shadow: 0 18px 50px #0005;
    }
    .mascote { font-size: 76px; animation: flutuar 2.5s ease-in-out infinite; }
    h1 { margin: 8px 0; font-size: clamp(32px, 8vw, 44px); }
    .subtitulo { color: #d7ffe0; line-height: 1.6; margin-bottom: 28px; }
    .botao {
      display: block; width: 100%; padding: 17px 14px; margin: 14px 0;
      border-radius: 16px; text-decoration: none; color: #10351b;
      background: #baff7d; font-weight: bold; font-size: 17px;
      box-shadow: 0 6px 0 #398b37; transition: transform .15s;
    }
    .servidor { background: #fff; box-shadow: 0 6px 0 #b7d9bf; }
    .botao:hover { transform: translateY(-2px); }
    .botao:active { transform: translateY(3px); box-shadow: none; }
    .aviso {
      margin-top: 25px; padding: 12px; border-radius: 12px;
      background: #ffffff17; color: #e5ffea; font-size: 13px; line-height: 1.5;
    }
    footer { margin-top: 24px; color: #c6f5ce; font-size: 12px; }
    @keyframes flutuar { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="mascote" aria-label="Yoshi">🦖</div>
    <h1>Yoshi World</h1>
    <p class="subtitulo">🌿 Um mundo de aventuras espera por você!<br>Prepare-se e venha jogar com a gente.</p>
    <a class="botao" href="https://w.app/yoshi" target="_blank" rel="noopener noreferrer">📲 LIGUE O SERVIDOR</a>
    <a class="botao servidor" href="https://add.aternos.org/yoshiserver" target="_blank" rel="noopener noreferrer">🎮 ENTRAR NO SERVIDOR</a>
    <div class="aviso">🍃 Antes de jogar, confira se o servidor está ligado. A disponibilidade depende do servidor.</div>
    <footer>Feito com 💚 para a comunidade Yoshi World</footer>
  </main>
</body>
</html>
